<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrator Login - NyumbaAI</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body>

<div class="admin-login-page">
    <div class="admin-login-card">

        <div class="admin-login-header">
            <div class="admin-lock-icon">🔒</div>
            <span class="admin-login-badge">Administrator Access</span>
            <h1>Admin Login</h1>
            <p>This area is restricted to NyumbaAI administrators only</p>
        </div>

        <div class="alert alert-error" id="adminLoginError"></div>

        <form id="adminLoginForm" novalidate>

            <div class="form-group">
                <label for="email">Administrator email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="admin@nyumbaai.com"
                    autocomplete="email"
                >
                <span class="form-error" id="emailError">
                    Please enter a valid email address
                </span>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your admin password"
                    autocomplete="current-password"
                >
                <span class="form-error" id="passwordError">
                    Please enter your password
                </span>
            </div>

            <button
                type="submit"
                class="btn btn-primary btn-full mt-8"
                id="adminLoginBtn"
            >
                <span id="adminLoginBtnText">Login to Dashboard</span>
                <span class="spinner" id="adminLoginSpinner"></span>
            </button>

        </form>

        <div class="admin-login-footer">
            Not an administrator?
            <a href="login.html">Go to client login</a>
        </div>

    </div>
</div>

<script src="../js/fetch.js"></script>
<script src="../js/admin.js"></script>
</body>
</html>
